name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.11
      - run: make lint

  renderer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: make test-renderer

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: pip install pyright
      - run: pyright src/

  executive-image:
    needs: renderer-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: podman build -f Dockerfile.executive -t autopoc-executive:ci .
      - name: Generate offline Heart speech with empty writable caches
        run: |
          podman run --rm --network=none --read-only --user=28128:0 --cpus=2 --memory=4g \
            --tmpfs /scratch:rw,size=1g,mode=1777 \
            --entrypoint /opt/autopoc/speech-venv/bin/python autopoc-executive:ci \
            -c 'from pathlib import Path; from autopoc.executive_speech import _HeartEngine, verify_speech_assets; root=Path("/opt/autopoc/speech-assets"); engine=_HeartEngine(root, verify_speech_assets(root)); audio=engine.synthesize("This is an offline executive narration sample."); assert audio.sample_rate == 24000 and len(audio.pcm16) > 24000; print("Offline Heart smoke passed")'

      - name: Verify actual AAC tone placement offline
        run: |
          podman run --rm --network=none --read-only --user=28128:0 --cpus=2 --memory=4g \
            --tmpfs /scratch:rw,size=1g,mode=1777 --env TMPDIR=/scratch \
            --env AUTOPOC_FFMPEG_INTEGRATION=1 -v "$PWD:/workspace:ro,Z" \
            --entrypoint node autopoc-executive:ci --test /workspace/renderer/audio.test.mjs

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: pip install -e ".[dev]"
      - run: make test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip install -r requirements.lock
      - run: pip-audit
      - name: Audit renderer pins including the CPU Torch base version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("renderer/requirements.lock").read_text()
          pins = re.findall(r"^([A-Za-z0-9_.-]+)(?:\[[^]]+\])?==([^\s\\]+)", text, re.M)
          direct = re.findall(r"^([A-Za-z0-9_.-]+) @ (\S+)", text, re.M)
          assert direct == [("en-core-web-sm", "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl")]
          assert any(name == "torch" for name, _ in pins)
          Path("/tmp/renderer-advisory-pins.txt").write_text("\n".join(name + "==" + (version.split("+", 1)[0] if name == "torch" else version) for name, version in pins) + "\n")
          print("English model wheel is upstream/hash-verified, outside PyPI advisory coverage.")
          PY
          pip-audit --requirement /tmp/renderer-advisory-pins.txt --no-deps --disable-pip

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: podman build -t autopoc-opencode:ci .
