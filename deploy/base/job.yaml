# AutoPoC Kubernetes Job template (OpenCode harness).
# Credentials come from the autopoc-credentials Secret.
# The prompt is set via overlay patches or scripts/run-autopoc.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: autopoc-JOB_SUFFIX
  namespace: autopoc
  labels:
    app: autopoc
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: autopoc
    spec:
      restartPolicy: Never
      serviceAccountName: autopoc-runner

      containers:
        - name: autopoc
          image: quay.io/autopoc/autopoc-opencode:latest
          args:
            - "run"
            - "--dangerously-skip-permissions"
            - "Run PoC for PLACEHOLDER_PROJECT from PLACEHOLDER_REPO"
          env:
            # --- Project configuration ---
            - name: AUTOPOC_PROJECT_NAME
              value: "PLACEHOLDER_PROJECT"
            - name: AUTOPOC_REPO_URL
              value: "PLACEHOLDER_REPO"
            - name: BUILD_STRATEGY
              value: "openshift"
            - name: AUTOPOC_FORK_TARGET
              value: "github"
            - name: AUTOPOC_WORK_DIR
              value: "/workspace"

            # --- Google Sheet configuration (for 'run-sheet' command) ---
            - name: AUTOPOC_SHEET_ID
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: AUTOPOC_SHEET_ID
                  optional: true
            - name: AUTOPOC_SHEET_CREDENTIALS
              value: "/etc/autopoc/google-sa/credentials.json"
            
            # --- Monthly Mode configuration (default behavior) ---
            - name: AUTOPOC_MONTHLY_MODE
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: AUTOPOC_MONTHLY_MODE
                  optional: true
            - name: AUTOPOC_TARGET_MONTH
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: AUTOPOC_TARGET_MONTH
                  optional: true
            - name: MAX_MONTHLY_POCS
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: MAX_MONTHLY_POCS
                  optional: true

            # --- LLM providers (configure one) ---
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: VERTEX_PROJECT
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: VERTEX_PROJECT
                  optional: true
            # OpenCode expects GOOGLE_CLOUD_PROJECT (not VERTEX_PROJECT)
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: VERTEX_PROJECT
                  optional: true
            - name: VERTEX_LOCATION
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: VERTEX_LOCATION
                  optional: true
            # Path to the mounted SA credentials file
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/etc/autopoc/google-sa/credentials.json"
            - name: LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: LLM_BASE_URL
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: LLM_API_KEY
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: LLM_MODEL
                  optional: true

            # --- OGX LLM Proxy (for PoC projects) ---
            - name: OGX_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: OGX_BASE_URL
                  optional: true
            - name: OGX_MODEL
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: OGX_MODEL
                  optional: true
            - name: OGX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: OGX_API_KEY
                  optional: true

            # --- Fork target ---
            - name: FORK_TARGET
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: FORK_TARGET
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: GITHUB_TOKEN
                  optional: true
            - name: GITHUB_ORG
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: GITHUB_ORG
                  optional: true
            - name: GITLAB_URL
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: GITLAB_URL
                  optional: true
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: GITLAB_TOKEN
                  optional: true
            - name: GITLAB_GROUP
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: GITLAB_GROUP
                  optional: true

            # --- Quay registry ---
            - name: QUAY_REGISTRY
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: QUAY_REGISTRY
                  optional: true
            - name: QUAY_ORG
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: QUAY_ORG
            - name: QUAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: QUAY_TOKEN
            - name: QUAY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: QUAY_USERNAME
                  optional: true

            # --- OpenShift ---
            - name: OPENSHIFT_API_URL
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: OPENSHIFT_API_URL
                  optional: true
            - name: OPENSHIFT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: OPENSHIFT_TOKEN
                  optional: true
            - name: OPENSHIFT_NAMESPACE_PREFIX
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: OPENSHIFT_NAMESPACE_PREFIX
                  optional: true

            # --- Tuning ---
            - name: MAX_BUILD_RETRIES
              valueFrom:
                secretKeyRef:
                  name: autopoc-credentials
                  key: MAX_BUILD_RETRIES
                  optional: true

          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"

          volumeMounts:
            - name: work
              mountPath: /workspace
            - name: google-sa
              mountPath: /etc/autopoc/google-sa
              readOnly: true

      volumes:
        - name: work
          emptyDir: {}
        - name: google-sa
          secret:
            secretName: autopoc-google-sa
            optional: true
