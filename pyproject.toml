[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autopoc"
version = "0.1.0"
description = "OpenCode skill-driven PoC pipeline for OpenShift AI deployments"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.6",
]

[project.scripts]
autopoc-tools = "autopoc.cli_tools:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autopoc"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "autopoc/data"

[tool.hatch.build.targets.sdist.force-include]
"data" = "data"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["tests/fixtures"]
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["autopoc"]
omit = [
    # Infrastructure tools that shell out to kubectl/podman — tested via e2e
    "*/tools/k8s_tools.py",
    "*/tools/podman_tools.py",
    # Thin CLI dispatcher — logic tested via sheet.py and llm_proxy.py
    "*/cli_tools.py",
    # Sheet write-back — tested via e2e (requires Sheets API)
    "*/sheet_write.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
