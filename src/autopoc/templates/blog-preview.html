<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{META_DESCRIPTION}}">
  <title>{{TITLE}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      line-height: 1.7;
      color: #1a1a1a;
      background: #fff;
    }

    /* --- Header --- */
    .header {
      background: #1a1a1a;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 3px solid #e00;
    }
    .header .logo { font-weight: 700; font-size: 1.1rem; }
    .header .logo span { color: #e00; }

    /* --- Hero --- */
    .hero {
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #fff;
      padding: 3rem 2rem;
      text-align: center;
    }
    .hero h1 {
      font-size: 2.2rem;
      font-weight: 700;
      max-width: 800px;
      margin: 0 auto 0.75rem;
      line-height: 1.3;
    }
    .hero .subtitle {
      font-size: 1.15rem;
      color: #ccc;
      max-width: 700px;
      margin: 0 auto 1.5rem;
      font-style: italic;
    }
    .hero .meta {
      font-size: 0.9rem;
      color: #999;
    }
    .hero .meta span { margin: 0 0.5rem; }

    /* --- Article --- */
    article {
      max-width: 800px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    article h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.3rem;
      border-bottom: 2px solid #e00;
      color: #1a1a1a;
    }
    article h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 2rem 0 0.75rem;
      color: #333;
    }
    article h4 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 1.5rem 0 0.5rem;
      color: #555;
    }

    article p {
      margin: 0 0 1.2rem;
      font-size: 1.05rem;
    }

    article ul, article ol {
      margin: 0 0 1.2rem 1.5rem;
      font-size: 1.05rem;
    }
    article li { margin-bottom: 0.4rem; }

    article a {
      color: #0066cc;
      text-decoration: none;
    }
    article a:hover { text-decoration: underline; }

    article strong { font-weight: 600; }

    article blockquote {
      border-left: 4px solid #e00;
      padding: 0.75rem 1rem;
      margin: 1.5rem 0;
      background: #f8f8f8;
      color: #444;
      font-style: italic;
    }

    /* --- Code --- */
    article code {
      font-family: "SFMono-Regular", "Cascadia Code", "Fira Code",
                   "JetBrains Mono", Consolas, monospace;
      font-size: 0.9em;
      background: #f0f0f0;
      padding: 0.15em 0.4em;
      border-radius: 3px;
    }
    article pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 1.2rem 1.5rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1.2rem 0 1.5rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    article pre code {
      background: none;
      padding: 0;
      color: inherit;
      font-size: inherit;
    }

    /* --- Tables --- */
    article table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2rem 0 1.5rem;
      font-size: 0.95rem;
    }
    article th {
      background: #f0f0f0;
      font-weight: 600;
      text-align: left;
      padding: 0.6rem 0.8rem;
      border-bottom: 2px solid #ddd;
    }
    article td {
      padding: 0.5rem 0.8rem;
      border-bottom: 1px solid #eee;
    }
    article tr:hover { background: #fafafa; }

    /* --- Image placeholders --- */
    .image-placeholder {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 1.5rem;
      margin: 1.5rem 0;
      background: #fafafa;
      text-align: center;
      color: #666;
    }
    .image-placeholder strong { color: #333; }

    /* --- Footer --- */
    .footer {
      background: #1a1a1a;
      color: #999;
      padding: 2rem;
      text-align: center;
      font-size: 0.85rem;
      margin-top: 3rem;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .hero h1 { font-size: 1.6rem; }
      article { padding: 1.5rem 1rem 3rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Open<span>Shift</span> AI — Developer Blog</div>
  </div>

  <div class="hero">
    <h1>{{TITLE}}</h1>
    <div class="subtitle">{{SUBTITLE}}</div>
    <div class="meta">
      <span>{{AUTHOR}}</span> &middot;
      <span>{{DATE}}</span> &middot;
      <span>{{READ_TIME}}</span>
    </div>
  </div>

  <article>
    {{BODY_CONTENT}}
  </article>

  <div class="footer">
    <p>Generated by AutoPoC &middot; Preview only — not for publication</p>
  </div>
</body>
</html>
